<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gelir Gider Takibi</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1f2430; --muted: #6b7280; --border: #e5e7eb;
    --green: #15803d; --green-bg: #dcfce7; --red: #b91c1c; --red-bg: #fee2e2; --blue: #1d4ed8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --card: #1b1e25; --text: #e5e7eb; --muted: #9ca3af; --border: #2d323c;
      --green: #4ade80; --green-bg: #14321f; --red: #f87171; --red-bg: #3a1a1a; --blue: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .summary .card { margin: 0; text-align: center; }
  .summary .label { color: var(--muted); font-size: .85rem; }
  .summary .value { font-size: 1.35rem; font-weight: 700; margin-top: 4px; }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-weight: 600; cursor: pointer; }
  .tabs button.active.gelir { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .tabs button.active.gider { background: var(--red-bg); color: var(--red); border-color: var(--red); }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  input, select { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; width: 100%; }
  .full { grid-column: 1 / -1; }
  .submit { grid-column: 1 / -1; padding: 11px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .head h2 { font-size: 1.1rem; margin: 0; }
  .head input { width: auto; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  .tag { font-size: .75rem; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .tag.gelir { background: var(--green-bg); color: var(--green); }
  .tag.gider { background: var(--red-bg); color: var(--red); }
  .info { flex: 1; min-width: 0; }
  .info .note { color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { font-weight: 700; white-space: nowrap; }
  .del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 4px; }
  .del:hover { color: var(--red); }
  .empty { color: var(--muted); text-align: center; padding: 16px 0; }
  @media (max-width: 520px) {
    .summary { grid-template-columns: 1fr; }
    form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gelir Gider Takibi</h1>

  <div class="summary">
    <div class="card"><div class="label">Toplam Gelir</div><div class="value pos" id="tGelir">0 ₺</div></div>
    <div class="card"><div class="label">Toplam Gider</div><div class="value neg" id="tGider">0 ₺</div></div>
    <div class="card"><div class="label">Kalan</div><div class="value" id="tKalan">0 ₺</div></div>
  </div>
  <div style="height:16px"></div>

  <div class="card">
    <div class="tabs">
      <button type="button" class="gelir active" data-tur="gelir">+ Gelir Ekle</button>
      <button type="button" class="gider" data-tur="gider">− Gider Ekle</button>
    </div>
    <form id="form">
      <label>Kategori
        <select id="kategori"></select>
      </label>
      <label>Tutar (₺)
        <input id="tutar" type="number" min="0" step="0.01" placeholder="0,00" required>
      </label>
      <label>Tarih
        <input id="tarih" type="date" required>
      </label>
      <label>Açıklama (isteğe bağlı)
        <input id="aciklama" type="text" placeholder="örn. Ekim elektrik faturası">
      </label>
      <button class="submit" type="submit" id="ekleBtn">Gelir Ekle</button>
    </form>
  </div>

  <div class="card">
    <div class="head">
      <h2>Kayıtlar</h2>
      <input id="ay" type="month" title="Ay seçin">
    </div>
    <ul id="liste"></ul>
  </div>
</div>

<script>
  const KATEGORILER = {
    gelir: ["Maaş", "Kira"],
    gider: ["Kredi Kartı", "Elektrik Faturası", "Su Faturası", "Doğalgaz Faturası", "İnternet Faturası",
            "Telefon Faturası", "Kira", "Aidat", "Market", "Ulaşım", "Kredi Taksiti", "Diğer"]
  };
  const KEY = "gelir-gider-kayitlar";
  let tur = "gelir";
  let kayitlar = [];
  try { kayitlar = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}

  const $ = id => document.getElementById(id);
  const para = n => n.toLocaleString("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₺";
  const bugun = new Date().toISOString().slice(0, 10);
  $("tarih").value = bugun;
  $("ay").value = bugun.slice(0, 7);

  function kaydet() { try { localStorage.setItem(KEY, JSON.stringify(kayitlar)); } catch (e) {} }

  function turSec(t) {
    tur = t;
    document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tur === t));
    $("kategori").innerHTML = KATEGORILER[t].map(k => `<option>${k}</option>`).join("");
    $("ekleBtn").textContent = t === "gelir" ? "Gelir Ekle" : "Gider Ekle";
  }

  function ciz() {
    const ay = $("ay").value;
    const liste = kayitlar.filter(k => !ay || k.tarih.startsWith(ay))
                          .sort((a, b) => b.tarih.localeCompare(a.tarih) || b.id - a.id);
    const gelir = liste.filter(k => k.tur === "gelir").reduce((s, k) => s + k.tutar, 0);
    const gider = liste.filter(k => k.tur === "gider").reduce((s, k) => s + k.tutar, 0);
    const kalan = gelir - gider;
    $("tGelir").textContent = para(gelir);
    $("tGider").textContent = para(gider);
    $("tKalan").textContent = para(kalan);
    $("tKalan").className = "value " + (kalan >= 0 ? "pos" : "neg");

    const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    $("liste").innerHTML = liste.length ? liste.map(k => `
      <li>
        <span class="tag ${k.tur}">${k.tur === "gelir" ? "Gelir" : "Gider"}</span>
        <div class="info">
          <div>${esc(k.kategori)}</div>
          <div class="note">${new Date(k.tarih).toLocaleDateString("tr-TR")}${k.aciklama ? " · " + esc(k.aciklama) : ""}</div>
        </div>
        <span class="amt ${k.tur === "gelir" ? "pos" : "neg"}">${k.tur === "gelir" ? "+" : "−"}${para(k.tutar)}</span>
        <button class="del" title="Sil" data-id="${k.id}">✕</button>
      </li>`).join("") : `<li class="empty">Bu ay için kayıt yok.</li>`;
  }

  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => turSec(b.dataset.tur)));

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const tutar = parseFloat($("tutar").value);
    if (!(tutar > 0)) return;
    kayitlar.push({ id: Date.now(), tur, kategori: $("kategori").value, tutar,
                    tarih: $("tarih").value, aciklama: $("aciklama").value.trim() });
    kaydet();
    $("tutar").value = ""; $("aciklama").value = "";
    $("ay").value = $("tarih").value.slice(0, 7);
    ciz();
  });

  $("liste").addEventListener("click", e => {
    const id = e.target.dataset && e.target.dataset.id;
    if (!id || !confirm("Bu kayıt silinsin mi?")) return;
    kayitlar = kayitlar.filter(k => String(k.id) !== id);
    kaydet(); ciz();
  });

  $("ay").addEventListener("change", ciz);

  turSec("gelir");
  ciz();
</script>
</body>
</html>
